name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only; creating a Release needs contents: write.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test KksSceneConv.sln -c Release
        env:
          # real-scene fixtures are committed; fail instead of skipping if they go missing
          KKS_REQUIRE_REAL_SCENES: '1'

      - name: Build (self-contained + lite)
        shell: pwsh
        run: pwsh -File tools/build.ps1

      - name: Rename lite exe
        shell: pwsh
        run: Copy-Item dist/lite/KksSceneConv.exe dist/KksSceneConv-lite.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KksSceneConv
          path: |
            dist/self-contained/KksSceneConv.exe
            dist/KksSceneConv-lite.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/self-contained/KksSceneConv.exe
            dist/KksSceneConv-lite.exe
          generate_release_notes: true
